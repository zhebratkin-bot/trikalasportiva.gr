<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Η σελίδα δεν βρέθηκε - trikalasportiva.gr. Σφάλμα 404.">
  <title>Η σελίδα δεν βρέθηκε | trikalasportiva.gr</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚽</text></svg>">
  
  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Header Placeholder -->
  <div id="header-placeholder"></div>

  <!-- Main Content (404 Area) -->
  <main class="error-page" id="main-content">
    <div class="container">
      <div class="error-container">
        
        <!-- Thematic SVG Illustration: Red Card + Whistle -->
        <div class="error-illustration" aria-hidden="true">
          <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="redGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#ef4444" />
                <stop offset="100%" stop-color="#b91c1c" />
              </linearGradient>
              <linearGradient id="silverGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#f1f5f9" />
                <stop offset="50%" stop-color="#94a3b8" />
                <stop offset="100%" stop-color="#475569" />
              </linearGradient>
              <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
                <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.3"/>
              </filter>
            </defs>
            
            <!-- Pitch Grid Background (Subtle circle and line) -->
            <circle cx="100" cy="100" r="80" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="4"/>
            <line x1="20" y1="100" x2="180" y2="100" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="4"/>

            <!-- Referee Whistle -->
            <g transform="translate(100, 100) rotate(-15) translate(-100, -100)">
              <!-- Whistle Body -->
              <path d="M 40,110 L 80,110 C 95,110 105,120 105,135 C 105,150 95,160 80,160 L 40,160 C 25,160 15,150 15,135 C 15,120 25,110 40,110 Z" fill="url(#silverGradient)" filter="url(#shadow)" stroke="#1e293b" stroke-width="2"/>
              <!-- Whistle Mouthpiece -->
              <rect x="95" y="122" width="35" height="26" rx="4" fill="url(#silverGradient)" stroke="#1e293b" stroke-width="2"/>
              <line x1="95" y1="135" x2="130" y2="135" stroke="#1e293b" stroke-width="2"/>
              <!-- Whistle Sound Hole -->
              <rect x="50" y="115" width="20" height="10" rx="2" fill="#1e293b"/>
              <!-- Whistle Loop -->
              <circle cx="20" cy="135" r="8" fill="none" stroke="#1e293b" stroke-width="2"/>
            </g>
            
            <!-- Red Card showing "404" -->
            <g transform="translate(110, 45) rotate(15)" filter="url(#shadow)">
              <!-- Card Body -->
              <rect x="0" y="0" width="70" height="105" rx="6" fill="url(#redGradient)" stroke="#7f1d1d" stroke-width="2"/>
              <!-- "404" Text on Red Card -->
              <text x="35" y="55" font-family="'Montserrat', sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">404</text>
              <!-- Small soccer ball icon on card -->
              <circle cx="35" cy="80" r="10" fill="#ffffff" opacity="0.8"/>
              <circle cx="35" cy="80" r="8" fill="none" stroke="#7f1d1d" stroke-width="1.5"/>
            </g>
          </svg>
        </div>

        <!-- Error Text -->
        <h2 class="error-title">Σφάλμα 404: Κόκκινη Κάρτα!</h2>
        <p class="error-text">
          Η σελίδα που προσπαθείτε να επισκεφθείτε δεν υπάρχει ή έχει μετακινηθεί εκτός αγωνιστικού χώρου. Μπορείτε να επιστρέψετε στην αρχική σελίδα για να δείτε τα τελευταία αθλητικά νέα των Τρικάλων.
        </p>

        <!-- Back to Home Button -->
        <a href="index.html" class="btn-home">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          Επιστροφή στην Αρχική
        </a>

      </div>
    </div>
  </main>

  <!-- Footer Placeholder -->
  <div id="footer-placeholder"></div>

  <!-- Core JavaScript Files -->
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
