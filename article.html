<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Διαβάστε τις λεπτομέρειες του άρθρου, αναλύσεις αγώνων και σχόλια στο trikalasportiva.gr.">
  <title>Άρθρο | trikalasportiva.gr</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚽</text></svg>">
  
  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Header Placeholder -->
  <div id="header-placeholder"></div>

  <!-- Breadcrumbs -->
  <div class="breadcrumbs-section">
    <div class="container">
      <nav class="breadcrumbs" id="breadcrumbs-placeholder" aria-label="Πλοήγηση Χαρτών">
        <!-- Dynamically loaded breadcrumbs -->
      </nav>
    </div>
  </div>

  <!-- Article Details Content -->
  <main id="main-content">
    <div class="container">
      <div class="article-grid">
        
        <!-- Main Column -->
        <div class="article-column">
          <article class="article-main">
            
            <header class="article-header">
              <!-- Hashtags below breadcrumbs -->
              <div class="article-tags" id="article-tags">
                <!-- Dynamically loaded tags -->
              </div>
              
              <!-- Title H1 -->
              <h1 class="article-title" id="article-title">Φόρτωση άρθρου...</h1>
              
              <div class="article-meta">
                <!-- Date of publication -->
                <div class="article-date" id="article-date">
                  <!-- Dynamically loaded date -->
                </div>
                
                <!-- Share icons top: Facebook, Twitter -->
                <div class="share-bar-top" id="share-bar-top">
                  <!-- Dynamically loaded top share buttons -->
                </div>
              </div>
            </header>

            <!-- Featured Image -->
            <div class="article-hero-image" id="article-image">
              <!-- Dynamically loaded image -->
            </div>

            <!-- Content -->
            <div class="article-body" id="article-content">
              <!-- Dynamically loaded paragraph HTML -->
            </div>

            <!-- Share bottom: Facebook, Twitter, Pinterest, Google -->
            <footer class="share-section-bottom">
              <h3 class="share-label">Μοιραστείτε το:</h3>
              <div class="share-bar-bottom" id="share-bar-bottom">
                <!-- Dynamically loaded bottom share buttons -->
              </div>
            </footer>

            <!-- Author Box (small author profile + link to author archive) -->
            <div class="author-box" id="article-author">
              <!-- Dynamically loaded author -->
            </div>

          </article>

          <!-- Related Articles (Схожі статті) -->
          <section class="related-articles">
            <h2 class="related-title">Σχετικά άρθρα</h2>
            <div class="news-grid" id="related-articles-grid">
              <!-- Dynamically loaded related articles -->
            </div>
          </section>
        </div>

        <!-- Sidebar (Popular Posts) -->
        <aside class="sidebar" aria-label="Δημοφιλή άρθρα">
          <div class="sidebar-widget">
            <h3 class="widget-title">Δημοφιλή Νέα</h3>
            <div class="popular-posts" id="popular-posts-widget">
              <!-- Dynamically loaded popular articles -->
            </div>
          </div>
        </aside>

      </div>
    </div>
  </main>

  <!-- Footer Placeholder -->
  <div id="footer-placeholder"></div>

  <!-- Core JavaScript Files -->
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
