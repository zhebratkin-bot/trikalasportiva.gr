<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Άρθρα, ρεπορτάζ και αναλύσεις από τους συντάκτες του trikalasportiva.gr.">
  <title>Συντάκτης | trikalasportiva.gr</title>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚽</text></svg>">

  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Header Placeholder -->
  <div id="header-placeholder"></div>

  <!-- Breadcrumbs -->
  <div class="breadcrumbs-section">
    <div class="container">
      <nav class="breadcrumbs" id="breadcrumbs-placeholder" aria-label="Πλοήγηση Χαρτών">
        <!-- Dynamically loaded breadcrumbs -->
      </nav>
    </div>
  </div>

  <!-- Author Content -->
  <main id="main-content">
    <section class="category-section">
      <div class="container">

        <!-- Author Hero (avatar, name, role, bio, socials) -->
        <header class="author-hero" id="author-hero">
          <!-- Dynamically loaded author profile -->
          <div style="padding: 2rem 0; color: var(--color-text-muted);">Φόρτωση συντάκτη...</div>
        </header>

        <!-- Section title -->
        <div class="category-header">
          <span class="category-badge">Άρθρα του συντάκτη</span>
          <div class="category-line"></div>
        </div>

        <!-- News Cards Grid -->
        <div class="news-grid" id="author-news-grid">
          <!-- Dynamically loaded from js/main.js -->
          <div style="grid-column: 1/-1; text-align: center; padding: 3rem 0; color: var(--color-text-muted);">
            Φόρτωση άρθρων...
          </div>
        </div>

        <!-- Left-Aligned Pagination Placeholder -->
        <div class="pagination-container" id="pagination-placeholder">
          <!-- Dynamically loaded pagination -->
        </div>

      </div>
    </section>
  </main>

  <!-- Footer Placeholder -->
  <div id="footer-placeholder"></div>

  <!-- Core JavaScript Files -->
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
