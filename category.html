<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Δείτε όλα τα αθλητικά νέα ανά κατηγορία στα Τρίκαλα. Αναλύσεις, ρεπορτάζ και αγωνιστικά νέα για ποδόσφαιρο, μπάσκετ, βόλεϊ και άλλα αθλήματα.">
  <title>Κατηγορία | trikalasportiva.gr</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚽</text></svg>">
  
  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Header Placeholder -->
  <div id="header-placeholder"></div>

  <!-- Breadcrumbs -->
  <div class="breadcrumbs-section">
    <div class="container">
      <nav class="breadcrumbs" id="breadcrumbs-placeholder" aria-label="Πλοήγηση Χαρτών">
        <!-- Dynamically loaded breadcrumbs -->
      </nav>
    </div>
  </div>

  <!-- Main Category Content -->
  <main id="main-content">
    <section class="category-section">
      <div class="container">
        
        <!-- Category Banner -->
        <header class="category-header">
          <h1 class="category-badge" id="cat-page-title">Φόρτωση...</h1>
          <div class="category-line"></div>
        </header>

        <!-- News Cards Grid -->
        <div class="news-grid" id="category-news-grid">
          <!-- Dynamically loaded from js/main.js -->
          <div style="grid-column: 1/-1; text-align: center; padding: 3rem 0; color: var(--color-text-muted);">
            Φόρτωση άρθρων...
          </div>
        </div>

        <!-- Left-Aligned Pagination Placeholder -->
        <div class="pagination-container" id="pagination-placeholder">
          <!-- Dynamically loaded pagination -->
        </div>

      </div>
    </section>
  </main>

  <!-- Footer Placeholder -->
  <div id="footer-placeholder"></div>

  <!-- Core JavaScript Files -->
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
